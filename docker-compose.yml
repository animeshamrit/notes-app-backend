services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: notes-db
    environment:
      POSTGRES_USER: notesapp
      POSTGRES_PASSWORD: localdev123
      POSTGRES_DB: notesdb
    ports:
      - "5432:5432"
    volumes:
      - notes_pg_data:/var/lib/postgresql/data

volumes:
  notes_pg_data: